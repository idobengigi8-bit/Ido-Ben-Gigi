<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>כפר יונה נוער — מעקב הגעה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #0D1B3E;
      --white: #FFFFFF;
      --gray-50: #F0F5FF;
      --gray-100: #E8EFFC;
      --gray-200: #C7D7F5;
      --gray-300: #A4BCEC;
      --gray-400: #7B9BD8;
      --gray-500: #5578BE;
      --gray-600: #3A5BA0;
      --gray-700: #274080;
      --gray-800: #162860;
      --accent: #2563EB;
      --accent-light: #DBEAFE;
      --accent-mid: #3B82F6;
      --green: #059669;
      --green-light: #D1FAE5;
      --red: #DC2626;
      --red-light: #FEE2E2;
      --amber: #B45309;
      --amber-light: #FEF3C7;
      --font: 'Heebo', sans-serif;
      --sidebar-width: 260px;
    }

    html, body, #root { height: 100%; font-family: var(--font); background: var(--gray-50); color: var(--black); direction: rtl; }

    /* Layout */
    .app-layout { display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      background: linear-gradient(160deg, #0D1B3E 0%, #1A3A7A 100%);
      color: var(--white);
      display: flex; flex-direction: column; padding: 36px 0 24px; flex-shrink: 0; order: -1;
      box-shadow: 4px 0 24px rgba(13,27,62,0.18);
    }
    .sidebar-brand { padding: 0 28px 32px; border-bottom: 1px solid rgba(255,255,255,0.07); margin-bottom: 16px; }
    .sidebar-brand-name { font-size: 19px; font-weight: 800; letter-spacing: -0.4px; }
    .sidebar-brand-tag { display: inline-block; margin-top: 8px; font-size: 11px; color: rgba(255,255,255,0.35); }
    .sidebar-nav { flex: 1; padding: 8px 16px; display: flex; flex-direction: column; gap: 2px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 10px;
      cursor: pointer; font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.5);
      border: none; background: transparent; width: 100%; text-align: right; font-family: var(--font);
      transition: background 0.15s, color 0.15s;
    }
    .nav-item:hover { background: rgba(255,255,255,0.07); color: var(--white); }
    .nav-item.active { background: rgba(255,255,255,0.18); color: var(--white); border-right: 3px solid rgba(255,255,255,0.6); }
    .nav-icon { font-size: 15px; opacity: 0.7; flex-shrink: 0; }
    .nav-item.active .nav-icon { opacity: 1; }
    .sidebar-footer { padding: 0 28px; font-size: 11px; color: rgba(255,255,255,0.18); }

    /* Main */
    .main-content { flex: 1; overflow-y: auto; padding: 44px 52px; }

    /* Page Header */
    .page-header { margin-bottom: 36px; }
    .page-title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
    .page-subtitle { font-size: 14px; color: var(--gray-500); margin-top: 5px; }
    .page-header-row { display: flex; justify-content: space-between; align-items: flex-start; }

    /* Card */
    .card { background: var(--white); border-radius: 16px; border: 1px solid var(--gray-200); padding: 24px; }

    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px; }
    .stat-card { background: var(--white); border-radius: 16px; border: 1px solid var(--gray-200); padding: 22px 24px; }
    .stat-card.black { background: linear-gradient(135deg, var(--accent) 0%, #0D1B3E 100%); border-color: var(--accent); box-shadow: 0 4px 16px rgba(37,99,235,0.25); }
    .stat-label { font-size: 12px; font-weight: 500; color: var(--gray-400); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card.black .stat-label { color: rgba(255,255,255,0.6); }
    .stat-value { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
    .stat-card.black .stat-value { color: var(--white); }
    .stat-value.green { color: var(--green); }
    .stat-value.red { color: var(--red); }
    .stat-meta { font-size: 12px; color: var(--gray-400); margin-top: 6px; }

    /* Badges */
    .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 100px; font-size: 12px; font-weight: 500; white-space: nowrap; }
    .badge-active { background: var(--green-light); color: var(--green); }
    .badge-inactive { background: var(--gray-100); color: var(--gray-500); }
    .badge-present { background: var(--green-light); color: var(--green); }
    .badge-late { background: var(--amber-light); color: var(--amber); }
    .badge-absent { background: var(--red-light); color: var(--red); }
    .badge-other { background: var(--gray-100); color: var(--gray-600); }

    /* Tables */
    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead th { text-align: right; padding: 10px 14px; font-size: 11px; font-weight: 600; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--gray-100); }
    tbody tr { border-bottom: 1px solid var(--gray-100); transition: background 0.1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--gray-50); }
    tbody td { padding: 15px 14px; font-size: 14px; color: var(--gray-600); }
    .td-bold { font-weight: 600; color: var(--black); }
    .td-desc { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--gray-400); }
    tr.clickable { cursor: pointer; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 18px; border-radius: 9px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.13s; border: none; font-family: var(--font); line-height: 1; }
    .btn-primary { background: linear-gradient(135deg, var(--accent) 0%, #1A4FBA 100%); color: var(--white); box-shadow: 0 2px 8px rgba(37,99,235,0.3); }
    .btn-primary:hover { background: linear-gradient(135deg, #1d55d4 0%, #1542a0 100%); box-shadow: 0 4px 14px rgba(37,99,235,0.4); }
    .btn-outline { background: transparent; color: var(--accent); border: 1.5px solid var(--gray-200); }
    .btn-outline:hover { border-color: var(--accent); background: var(--accent-light); }
    .btn-ghost { background: transparent; color: var(--gray-400); border: none; padding: 6px 9px; border-radius: 7px; font-family: var(--font); cursor: pointer; font-size: 14px; transition: all 0.13s; }
    .btn-ghost:hover { color: var(--accent); background: var(--accent-light); }
    .btn-danger { background: transparent; color: var(--gray-300); border: none; padding: 6px 9px; border-radius: 7px; cursor: pointer; font-size: 13px; font-family: var(--font); transition: all 0.13s; }
    .btn-danger:hover { color: var(--red); background: var(--red-light); }

    /* Section Header */
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .section-title { font-size: 15px; font-weight: 600; }

    /* Filter Tabs */
    .filter-tabs { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
    .filter-tab { padding: 6px 15px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1.5px solid var(--gray-200); background: transparent; color: var(--gray-500); transition: all 0.13s; font-family: var(--font); }
    .filter-tab:hover { border-color: var(--gray-400); color: var(--black); }
    .filter-tab.active { background: var(--accent); color: var(--white); border-color: var(--accent); }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; backdrop-filter: blur(2px); }
    .modal { background: var(--white); border-radius: 20px; padding: 32px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 64px rgba(0,0,0,0.15); }
    .modal-title { font-size: 19px; font-weight: 700; margin-bottom: 24px; letter-spacing: -0.3px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-500); margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.4px; }
    .form-control { width: 100%; padding: 10px 13px; border: 1.5px solid var(--gray-200); border-radius: 9px; font-size: 14px; font-family: var(--font); color: var(--black); background: var(--white); transition: border-color 0.15s; direction: rtl; }
    .form-control:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
    .form-control::placeholder { color: var(--gray-300); }
    textarea.form-control { resize: vertical; min-height: 90px; }
    select.form-control { cursor: pointer; }
    .form-check { display: flex; align-items: center; gap: 8px; }
    .form-actions { display: flex; gap: 10px; margin-top: 26px; }

    /* Empty State */
    .empty-state { text-align: center; padding: 52px 20px; }
    .empty-icon { font-size: 32px; margin-bottom: 10px; }
    .empty-text { font-size: 14px; color: var(--gray-400); }

    /* Attendance marking */
    .attendance-toggle-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .toggle-btn { padding: 8px 13px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--gray-200); background: transparent; color: var(--gray-400); font-family: var(--font); transition: all 0.13s; white-space: nowrap; }
    .toggle-btn:hover { border-color: var(--gray-400); }
    .toggle-btn.present.active { background: var(--green); border-color: var(--green); color: var(--white); }
    .toggle-btn.late.active { background: var(--amber); border-color: var(--amber); color: var(--white); }
    .toggle-btn.absent.active { background: var(--red); border-color: var(--red); color: var(--white); }
    .toggle-btn.other.active { background: var(--gray-600); border-color: var(--gray-600); color: var(--white); }

    .player-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--gray-100); gap: 14px; flex-wrap: wrap; }
    .player-row-note { width: 100%; margin-top: 4px; }
    .player-row-note .form-control { padding: 8px 12px; font-size: 13px; }
    .player-row:last-child { border-bottom: none; }
    .player-row-info { min-width: 0; flex: 1; }
    .player-row-name { font-size: 14px; font-weight: 600; color: var(--black); }
    .player-row-pos { font-size: 12px; color: var(--gray-400); margin-top: 2px; }

    .pct-good { color: var(--green); font-weight: 700; }
    .pct-mid { color: var(--amber); font-weight: 700; }
    .pct-low { color: var(--red); font-weight: 700; }
    .pct-none { color: var(--gray-300); }

    .session-summary { display: flex; gap: 20px; margin-bottom: 22px; flex-wrap: wrap; }
    .session-summary-item { font-size: 13px; color: var(--gray-500); }
    .session-summary-item b { color: var(--black); font-size: 15px; }

    .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--gray-500); cursor: pointer; background: none; border: none; font-family: var(--font); margin-bottom: 14px; padding: 4px 0; }
    .back-link:hover { color: var(--accent); }

    /* ── Mobile / Tablet (iPad portrait included) ──────────────────── */
    @media (max-width: 1024px) {
      /* Sidebar → bottom nav */
      .sidebar {
        position: fixed; bottom: 0; left: 0; right: 0;
        width: 100%; height: auto; flex-direction: row;
        padding: 0 0 env(safe-area-inset-bottom);
        border-top: 1px solid rgba(255,255,255,0.1); z-index: 100;
      }
      .sidebar-brand, .sidebar-footer { display: none; }
      .sidebar-nav { flex-direction: row; padding: 6px 8px; gap: 0; justify-content: space-around; }
      .nav-item {
        flex-direction: column; gap: 3px; padding: 10px 20px;
        font-size: 11px; border-radius: 12px; flex: 1;
        justify-content: center; align-items: center;
      }
      .nav-icon { font-size: 22px; opacity: 0.7; }

      /* Layout */
      .main-content { padding: 24px 16px 100px; }
      .app-layout { flex-direction: column; }

      /* Header */
      .page-title { font-size: 22px; }
      .page-header { margin-bottom: 24px; }
      .page-header-row { flex-direction: column; gap: 14px; }
      .page-header-row .btn-primary { width: 100%; justify-content: center; padding: 14px; }

      /* Stats */
      .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .stat-card { padding: 16px 18px; }
      .stat-value { font-size: 22px; }

      /* Table → larger touch targets */
      tbody td { padding: 18px 10px; }
      thead th { padding: 10px; }
      .btn-danger, .btn-ghost { padding: 10px 12px; font-size: 15px; }

      /* Forms */
      .form-row { grid-template-columns: 1fr; }
      .form-control { padding: 14px; font-size: 16px; } /* 16px prevents iOS zoom */
      .form-actions { flex-direction: column; }
      .form-actions .btn { width: 100%; justify-content: center; padding: 14px; }

      /* Modal → bottom sheet */
      .modal-overlay { align-items: flex-end; padding: 0; }
      .modal { border-radius: 24px 24px 0 0; padding: 28px 20px 36px; max-height: 92vh; }

      /* Filter tabs */
      .filter-tabs { gap: 6px; }
      .filter-tab { padding: 8px 14px; font-size: 13px; }

      /* Attendance marking */
      .toggle-btn { padding: 11px 14px; font-size: 13px; }
      .player-row { padding: 16px 0; }
      .attendance-toggle-group { width: 100%; }
      .toggle-btn { flex: 1; }
    }

    /* ── Print / PDF ────────────────────────────────────────────── */
    @media print {
      html, body, #root { height: auto !important; overflow: visible !important; }
      .sidebar, .btn, .back-link, .filter-tabs, .attendance-toggle-group, .player-row-note { display: none !important; }
      .app-layout { display: block !important; height: auto !important; overflow: visible !important; }
      .main-content { padding: 0 !important; overflow: visible !important; height: auto !important; }
      .card { border: none; box-shadow: none; padding: 0; margin-bottom: 20px; page-break-inside: avoid; }
      .table-wrapper { overflow: visible !important; }
      table { font-size: 11px; }
      .page-header-row { display: block; }
      .session-summary { margin-bottom: 16px; }
      .player-row { padding: 6px 0; }
      .print-status { display: inline !important; font-size: 13px; font-weight: 600; color: var(--black); }
    }
    .print-status { display: none; }

    /* ── Image export (used instead of window.print, which is a no-op
       when the app runs as an iOS "Add to Home Screen" standalone app) ── */
    body.is-exporting .sidebar, body.is-exporting .btn, body.is-exporting .back-link,
    body.is-exporting .filter-tabs, body.is-exporting .attendance-toggle-group,
    body.is-exporting .player-row-note { display: none !important; }
    body.is-exporting .print-status { display: inline !important; font-size: 13px; font-weight: 600; color: var(--black); }
  </style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { h, render } from 'https://esm.sh/preact@10.19.3'
import { useState, useEffect, useRef } from 'https://esm.sh/preact@10.19.3/hooks'
import htm from 'https://esm.sh/htm@3.1.1'
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
import html2canvas from 'https://esm.sh/html2canvas@1.4.1'
const html = htm.bind(h)

// ── Supabase ───────────────────────────────────────────────────────
const sb = createClient(
  'https://nqtbetkdhwrhcnwwbklc.supabase.co',
  'sb_publishable_JqrTx58alqSOR_sGEMCHBA_il4jloZO'
)

// ── Utilities ──────────────────────────────────────────────────────
const DEFAULT_DATA = { players: [], sessions: [], attendance: [] }

const today = () => new Date().toISOString().split('T')[0]
const fmtDate = (d) => new Date(d).toLocaleDateString('he-IL')

// צילום אזור למסך כתמונה (במקום window.print, שלא פועל כשהאפליקציה רצה
// כאייקון עצמאי במסך הבית ב-iOS)
const captureImage = async (el) => {
  document.body.classList.add('is-exporting')
  await new Promise(r => setTimeout(r, 50))
  try {
    const canvas = await html2canvas(el, { backgroundColor: '#ffffff', scale: 2 })
    return canvas.toDataURL('image/png')
  } finally {
    document.body.classList.remove('is-exporting')
  }
}

function ImagePreviewModal({ src, onClose }) {
  return html`
    <div class="modal-overlay" onClick=${e => e.target === e.currentTarget && onClose()}>
      <div class="modal" style=${{ maxWidth: 700 }}>
        <h2 class="modal-title" style=${{ fontSize: 15 }}>לחיצה ארוכה על התמונה → שמירה / שיתוף / הדפסה</h2>
        <img src=${src} style=${{ width: '100%', borderRadius: 8, border: '1px solid var(--gray-200)', display: 'block' }} />
        <div class="form-actions">
          <button class="btn btn-outline" onClick=${onClose}>סגור</button>
        </div>
      </div>
    </div>
  `
}

const STATUS_LABELS = { present: 'נוכח', late: 'באיחור', absent: 'נעדר', other: 'אחר' }
const STATUS_BADGE   = { present: 'badge-present', late: 'badge-late', absent: 'badge-absent', other: 'badge-other' }

const attendanceForSession = (attendance, sessionId) => attendance.filter(a => a.session_id === sessionId)
const attendanceForPlayer  = (attendance, playerId)  => attendance.filter(a => a.player_id === playerId)

// "אחר" (חופשה/מחלה/פציעה וכו') נספר כנעדר לצורך אחוז הנוכחות
const pctOf = (records) => {
  if (records.length === 0) return null
  const attended = records.filter(r => r.status === 'present' || r.status === 'late').length
  return Math.round((attended / records.length) * 100)
}

const pctClass = (pct) => pct === null ? 'pct-none' : pct >= 80 ? 'pct-good' : pct >= 50 ? 'pct-mid' : 'pct-low'

// ── Sidebar ────────────────────────────────────────────────────────
function Sidebar({ activeTab, setActiveTab }) {
  const nav = [
    { id: 'dashboard', label: 'דשבורד',       icon: '⊞' },
    { id: 'players',   label: 'שחקנים',       icon: '◈' },
    { id: 'sessions',  label: 'אימונים',       icon: '◎' },
    { id: 'report',    label: 'דוח נוכחות',    icon: '▤' },
  ]
  return html`
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-name">כפר יונה נוער</div>
        <span class="sidebar-brand-tag">מעקב הגעה · עידו בן גיגי</span>
      </div>
      <nav class="sidebar-nav">
        ${nav.map(item => html`
          <button
            key=${item.id}
            class=${'nav-item' + (activeTab === item.id ? ' active' : '')}
            onClick=${() => setActiveTab(item.id)}
          >
            <span class="nav-icon">${item.icon}</span>
            ${item.label}
          </button>
        `)}
      </nav>
      <div class="sidebar-footer">© ${new Date().getFullYear()} כפר יונה נוער</div>
    </aside>
  `
}

// ── Dashboard ──────────────────────────────────────────────────────
function Dashboard({ players, sessions, attendance, onOpenSession, setActiveTab }) {
  const activePlayers = players.filter(p => p.active)
  const pct = pctOf(attendance)
  const recent = [...sessions].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5)
  const latestSession = recent[0]
  const latestOthers = latestSession
    ? attendance
        .filter(a => a.session_id === latestSession.id && a.status === 'other')
        .map(a => ({ player: players.find(p => p.id === a.player_id), note: a.note }))
        .filter(o => o.player)
    : []

  return html`
    <div>
      <div class="page-header">
        <h1 class="page-title">שלום עידו 👋</h1>
        <p class="page-subtitle">מעקב הגעה — קבוצת הנוער, כפר יונה</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">שחקנים פעילים</div>
          <div class="stat-value">${activePlayers.length}</div>
          <div class="stat-meta">מתוך ${players.length} ברשימה</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">אימונים</div>
          <div class="stat-value">${sessions.length}</div>
          <div class="stat-meta">מתחילת העונה</div>
        </div>
        <div class="stat-card black">
          <div class="stat-label">נוכחות ממוצעת</div>
          <div class="stat-value">${pct === null ? '—' : pct + '%'}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">אימון אחרון</div>
          <div class="stat-value" style=${{ fontSize: 17 }}>${recent[0] ? fmtDate(recent[0].date) : '—'}</div>
        </div>
      </div>

      ${latestOthers.length > 0 && html`
        <div class="card" style=${{ marginBottom: 28 }}>
          <div class="section-header">
            <h2 class="section-title">לא זמינים באימון האחרון (${fmtDate(latestSession.date)})</h2>
          </div>
          ${latestOthers.map(o => html`
            <div key=${o.player.id} class="player-row">
              <div class="player-row-info">
                <div class="player-row-name">${o.player.name}</div>
              </div>
              <div style=${{ fontSize: 13, color: 'var(--gray-500)' }}>${o.note || 'ללא סיבה מצוינת'}</div>
            </div>
          `)}
        </div>
      `}

      <div class="card">
        <div class="section-header">
          <h2 class="section-title">אימונים אחרונים</h2>

            <div class="empty-icon">📋</div>
            <div class="empty-text">אין אימונים עדיין — עבור ל"אימונים" כדי להוסיף</div>
          </div>
        ` : html`
          <div class="table-wrapper">
            <table>
              <thead>
                <tr><th>תאריך</th><th>הערה</th><th>נוכחים</th><th>אחוז</th></tr>
              </thead>
              <tbody>
                ${recent.map(s => {
                  const records = attendanceForSession(attendance, s.id)
                  const attended = records.filter(r => r.status === 'present' || r.status === 'late').length
                  const sPct = pctOf(records)
                  return html`
                    <tr key=${s.id} class="clickable" onClick=${() => onOpenSession(s.id)}>

              <thead>
                <tr><th>שם</th><th>תפקיד</th><th>טלפון</th><th>נוכחות</th><th>סטטוס</th><th></th></tr>
              </thead>
              <tbody>
                ${filtered.map(p => {

                  return html`
                    <tr key=${p.id}>

// ── Session Detail (attendance marking) ───────────────────────────
function SessionDetail({ session, players, attendance, onReload, onBack }) {
  const records = attendanceForSession(attendance, session.id)
  const rosterIds = new Set(players.filter(p => p.active).map(p => p.id))
  records.forEach(r => rosterIds.add(r.player_id))
  const roster = players.filter(p => rosterIds.has(p.id)).sort((a, b) => a.name.localeCompare(b.name, 'he'))

  const [statusMap, setStatusMap] = useState({})
  const [noteMap, setNoteMap]     = useState({})
  const [saved, setSaved]         = useState(false)
  useEffect(() => {
    const sMap = {}, nMap = {}
    records.forEach(r => { sMap[r.player_id] = r.status; nMap[r.player_id] = r.note || '' })
    setStatusMap(sMap)
    setNoteMap(nMap)
  }, [attendance, session.id])

  const setStatus = async (playerId, status) => {
    setStatusMap(m => ({ ...m, [playerId]: status }))
    await sb.from('attendance').upsert(
      { session_id: session.id, player_id: playerId, status },
      { onConflict: 'session_id,player_id' }
    )
    onReload()
  }

  const saveNote = async (playerId, note) => {
    await sb.from('attendance').upsert(
      { session_id: session.id, player_id: playerId, status: statusMap[playerId] || 'other', note },
      { onConflict: 'session_id,player_id' }
    )
    onReload()
  }

  const markAllPresent = async () => {
    const unmarked = roster.filter(p => !statusMap[p.id])
    if (unmarked.length === 0) return
    await Promise.all(unmarked.map(p =>
      sb.from('attendance').upsert({ session_id: session.id, player_id: p.id, status: 'present' }, { onConflict: 'session_id,player_id' })
    ))
    onReload()
  }

  // שמירה ידנית — הכל כבר נשמר אוטומטית בכל לחיצה, זה בעיקר לשקט נפשי:
  // מוודא שגם הערת "אחר" שכתובה כרגע בשדה (ולא עזבו אותו עדיין) נשמרת.
  const saveAll = async () => {
    if (document.activeElement) document.activeElement.blur()
    const marked = roster.filter(p => statusMap[p.id])
    await Promise.all(marked.map(p =>
      sb.from('attendance').upsert(
        { session_id: session.id, player_id: p.id, status: statusMap[p.id], note: noteMap[p.id] || null },
        { onConflict: 'session_id,player_id' }
      )
    ))
    onReload()
    setSaved(true)
    setTimeout(() => setSaved(false), 2000)
  }

  const counts = { present: 0, late: 0, absent: 0, other: 0 }
  roster.forEach(p => { const s = statusMap[p.id]; if (s) counts[s]++ })
  const unmarkedCount = roster.length - (counts.present + counts.late + counts.absent + counts.other)

  const captureRef = useRef(null)
  const [previewImg, setPreviewImg] = useState(null)
  const [exporting, setExporting]   = useState(false)
  const exportImage = async () => {
    setExporting(true)
    try { setPreviewImg(await captureImage(captureRef.current)) }
    finally { setExporting(false) }
  }

  return html`
    <div>
      <button class="back-link" onClick=${onBack}>→ חזרה לרשימת האימונים</button>
      <div class="page-header">
        <div class="page-header-row">
          <div>
            <h1 class="page-title">${fmtDate(session.date)}</h1>
            <p class="page-subtitle">${session.note || 'סימון נוכחות לאימון'}</p>
          </div>
          <div style=${{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
            <button class="btn btn-outline" onClick=${markAllPresent}>סמן הכל כנוכחים</button>
            <button class="btn btn-primary" onClick=${saveAll}>${saved ? '✓ נשמר' : 'שמירה'}</button>
            <button class="btn btn-outline" onClick=${exportImage}>${exporting ? 'מכין תמונה...' : 'ייצוא לתמונה'}</button>
          </div>
        </div>
      </div>

      <div ref=${captureRef}>
        <div class="session-summary">
          <div class="session-summary-item"><b>${counts.present}</b> נוכחים</div>
          <div class="session-summary-item"><b>${counts.late}</b> באיחור</div>
          <div class="session-summary-item"><b>${counts.absent}</b> נעדרים</div>
          ${counts.other > 0 && html`<div class="session-summary-item"><b>${counts.other}</b> אחר</div>`}
          ${unmarkedCount > 0 && html`<div class="session-summary-item"><b>${unmarkedCount}</b> לא סומנו</div>`}
        </div>

        <div class="card">
          ${roster.length === 0 ? html`
            <div class="empty-state">
              <div class="empty-icon">👥</div>
              <div class="empty-text">אין שחקנים פעילים ברשימה — עבור ל"שחקנים" כדי להוסיף</div>
            </div>
          ` : roster.map(p => html`
            <div key=${p.id} class="player-row">
              <div class="player-row-info">
                <div class="player-row-name">${p.name}</div>
                ${p.position && html`<div class="player-row-pos">${p.position}</div>`}
              </div>
              <div class="attendance-toggle-group">
                <button class=${'toggle-btn present' + (statusMap[p.id] === 'present' ? ' active' : '')} onClick=${() => setStatus(p.id, 'present')}>נוכח</button>
                <button class=${'toggle-btn late' + (statusMap[p.id] === 'late' ? ' active' : '')} onClick=${() => setStatus(p.id, 'late')}>איחור</button>
                <button class=${'toggle-btn absent' + (statusMap[p.id] === 'absent' ? ' active' : '')} onClick=${() => setStatus(p.id, 'absent')}>נעדר</button>
                <button class=${'toggle-btn other' + (statusMap[p.id] === 'other' ? ' active' : '')} onClick=${() => setStatus(p.id, 'other')}>אחר</button>
              </div>
              <span class="print-status">${STATUS_LABELS[statusMap[p.id]] || 'לא סומן'}${statusMap[p.id] === 'other' && noteMap[p.id] ? ' — ' + noteMap[p.id] : ''}</span>
              ${statusMap[p.id] === 'other' && html`
                <div class="player-row-note">
                  <input
                    class="form-control"
                    placeholder="סיבה: חופשה / מחלה / פציעה..."
                    value=${noteMap[p.id] || ''}
                    onInput=${e => setNoteMap(m => ({ ...m, [p.id]: e.target.value }))}
                    onBlur=${e => saveNote(p.id, e.target.value)}
                  />
                </div>
              `}
            </div>
          `)}
        </div>
      </div>

      ${previewImg && html`<${ImagePreviewModal} src=${previewImg} onClose=${() => setPreviewImg(null)} />`}
    </div>
  `
}

// ── Sessions ───────────────────────────────────────────────────────
const EMPTY_SESSION = { date: '', note: '' }

function Sessions({ sessions, players, attendance, selectedId, onSelect, onReload }) {
  const [showModal, setShowModal] = useState(false)
  const [editId, setEditId]       = useState(null)
  const [form, setForm]           = useState(EMPTY_SESSION)

  const selected = selectedId ? sessions.find(s => s.id === selectedId) : null
  if (selected) {
    return html`<${SessionDetail} session=${selected} players=${players} attendance=${attendance} onReload=${onReload} onBack=${() => onSelect(null)} />`
  }

  const sorted = [...sessions].sort((a, b) => new Date(b.date) - new Date(a.date))
  const set = (field) => (e) => setForm(f => ({ ...f, [field]: e.target.value }))

  const openAdd = () => { setForm({ date: today(), note: '' }); setEditId(null); setShowModal(true) }
  const openEdit = (s, e) => { e.stopPropagation(); setForm({ date: s.date, note: s.note || '' }); setEditId(s.id); setShowModal(true) }

  const handleSave = async () => {
    if (!form.date) return
    if (editId) {
      await sb.from('sessions').update(form).eq('id', editId)
      setShowModal(false)
      onReload()
    } else {
      const { data } = await sb.from('sessions').insert(form).select().single()
      setShowModal(false)
      onReload()
      if (data) onSelect(data.id)
    }
  }

  const handleDelete = async (id, e) => {
    e.stopPropagation()
    if (window.confirm('למחוק את האימון? נתוני הנוכחות שלו יימחקו גם הם.')) {
      await sb.from('sessions').delete().eq('id', id)
      onReload()
    }
  }

  return html`
    <div>
      <div class="page-header">
        <div class="page-header-row">
          <div>
            <h1 class="page-title">אימונים</h1>
            <p class="page-subtitle">לחץ על אימון כדי לסמן נוכחות</p>
          </div>
          <button class="btn btn-primary" onClick=${openAdd}>+ אימון חדש</button>
        </div>
      </div>

      <div class="card">
        ${sorted.length === 0 ? html`
          <div class="empty-state">
            <div class="empty-icon">📋</div>
            <div class="empty-text">אין אימונים עדיין — לחץ "+ אימון חדש"</div>
          </div>
        ` : html`
          <div class="table-wrapper">
            <table>
              <thead>
                <tr><th>תאריך</th><th>הערה</th><th>נוכחים</th><th>אחוז</th><th></th></tr>
              </thead>
              <tbody>
                ${sorted.map(s => {
                  const records = attendanceForSession(attendance, s.id)
                  const attended = records.filter(r => r.status === 'present' || r.status === 'late').length
                  const sPct = pctOf(records)
                  return html`
                    <tr key=${s.id} class="clickable" onClick=${() => onSelect(s.id)}>
                      <td class="td-bold">${fmtDate(s.date)}</td>
                      <td><div class="td-desc">${s.note || '—'}</div></td>
                      <td>${records.length ? `${attended}/${records.length}` : '—'}</td>
                      <td><span class=${pctClass(sPct)}>${sPct === null ? '—' : sPct + '%'}</span></td>
                      <td>
                        <div style=${{ display: 'flex', gap: 2, justifyContent: 'flex-end' }}>
                          <button class="btn-ghost" onClick=${e => openEdit(s, e)}>✏️</button>
                          <button class="btn-danger" onClick=${e => handleDelete(s.id, e)}>✕</button>
                        </div>
                      </td>
                    </tr>
                  `
                })}
              </tbody>
            </table>
          </div>
        `}
      </div>

      ${showModal && html`
        <div class="modal-overlay" onClick=${e => e.target === e.currentTarget && setShowModal(false)}>
          <div class="modal">
            <h2 class="modal-title">${editId ? 'עריכת אימון' : 'אימון חדש'}</h2>
            <div class="form-group">
              <label class="form-label">תאריך *</label>
              <input type="date" class="form-control" value=${form.date} onInput=${set('date')} />
            </div>
            <div class="form-group">
              <label class="form-label">הערה</label>
              <input class="form-control" placeholder="לדוגמה: אימון כוח, משחק חימום..." value=${form.note} onInput=${set('note')} />

            <div class="form-actions">
              <button class="btn btn-primary" onClick=${handleSave}>${editId ? 'שמור שינויים' : 'צור אימון'}</button>

            </div>
          </div>
        </div>
      `}
    </div>
  `

// ── Report ─────────────────────────────────────────────────────────
function Report({ players, sessions, attendance }) {
  const captureRef = useRef(null)
  const [previewImg, setPreviewImg] = useState(null)
  const [exporting, setExporting]   = useState(false)
  const exportImage = async () => {
    setExporting(true)
    try { setPreviewImg(await captureImage(captureRef.current)) }
    finally { setExporting(false) }
  }

  const rows = players
    .map(p => {
      const records = attendanceForPlayer(attendance, p.id)
      const present = records.filter(r => r.status === 'present').length
      const late    = records.filter(r => r.status === 'late').length
      const absent  = records.filter(r => r.status === 'absent').length
      const other   = records.filter(r => r.status === 'other').length
      const pct     = pctOf(records)
      return { player: p, marked: records.length, present, late, absent, other, pct }
    })
    .sort((a, b) => (b.pct ?? -1) - (a.pct ?? -1))

  const exportCsv = () => {
    const header = ['שם', 'תפקיד', 'אימונים שסומנו', 'נוכח', 'איחור', 'נעדר', 'אחר', 'אחוז נוכחות']
    const lines = rows.map(r => [
      r.player.name, r.player.position || '', r.marked, r.present, r.late, r.absent, r.other, r.pct === null ? '' : r.pct + '%'
    ])
    const csv = '﻿' + [header, ...lines].map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n')
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' })
    const url = URL.createObjectURL(blob)
    const a = document.createElement('a')
    a.href = url
    a.download = `דוח-נוכחות-${today()}.csv`
    a.click()
    URL.revokeObjectURL(url)
  }

  // מטריצה: כל שחקן מול כל אימון, בדף/קובץ אחד מרוכז
  const sortedSessions = [...sessions].sort((a, b) => new Date(a.date) - new Date(b.date))
  const sortedPlayers  = [...players].sort((a, b) => a.name.localeCompare(b.name, 'he'))
  const cellRecord = (playerId, sessionId) => attendance.find(a => a.player_id === playerId && a.session_id === sessionId)
  const CELL_LABEL = { present: 'נוכח', late: 'איחור', absent: 'נעדר', other: 'אחר' }
  const CELL_CLASS = { present: 'badge-present', late: 'badge-late', absent: 'badge-absent', other: 'badge-other' }

  const exportMatrixCsv = () => {
    const header = ['שחקן', ...sortedSessions.map(s => fmtDate(s.date))]
    const lines = sortedPlayers.map(p => [
      p.name,
      ...sortedSessions.map(s => {
        const rec = cellRecord(p.id, s.id)
        if (!rec) return ''
        return CELL_LABEL[rec.status] + (rec.note ? ` (${rec.note})` : '')
      })
    ])
    const csv = '﻿' + [header, ...lines].map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n')
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' })
    const url = URL.createObjectURL(blob)
    const a = document.createElement('a')
    a.href = url
    a.download = `נוכחות-כל-האימונים-${today()}.csv`
    a.click()
    URL.revokeObjectURL(url)
  }

  return html`
    <div>
      <div class="page-header">
        <div class="page-header-row">
          <div>
            <h1 class="page-title">דוח נוכחות</h1>
            <p class="page-subtitle">אחוזי הגעה לפי שחקן, לאורך העונה</p>
          </div>
          ${rows.length > 0 && html`
            <div style=${{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
              <button class="btn btn-primary" onClick=${exportImage}>${exporting ? 'מכין תמונה...' : 'ייצוא לתמונה'}</button>
              <button class="btn btn-outline" onClick=${exportCsv}>ייצוא CSV</button>
            </div>
          `}
        </div>
      </div>

      <div ref=${captureRef}>
        <div class="card">
          ${sessions.length === 0 ? html`
            <div class="empty-state">
              <div class="empty-icon">▤</div>
              <div class="empty-text">אין עדיין נתוני נוכחות — התחל בהוספת אימון ושחקנים</div>
            </div>
          ` : html`
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr><th>שם</th><th>תפקיד</th><th>אימונים</th><th>נוכח</th><th>איחור</th><th>נעדר</th><th>אחר</th><th>אחוז נוכחות</th></tr>
                </thead>
                <tbody>
                  ${rows.map(r => html`
                    <tr key=${r.player.id}>
                      <td class="td-bold">${r.player.name}</td>
                      <td>${r.player.position || '—'}</td>
                      <td>${r.marked}</td>
                      <td>${r.present}</td>
                      <td>${r.late}</td>
                      <td>${r.absent}</td>
                      <td>${r.other}</td>
                      <td><span class=${pctClass(r.pct)}>${r.pct === null ? 'אין נתונים' : r.pct + '%'}</span></td>
                    </tr>
                  `)}
                </tbody>
              </table>
            </div>
          `}
        </div>

        ${sortedSessions.length > 0 && html`
          <div class="card" style=${{ marginTop: 24 }}>
            <div class="section-header">
              <h2 class="section-title">נוכחות מפורטת לפי אימון</h2>
              <button class="btn btn-outline" style=${{ fontSize: 13, padding: '6px 13px' }} onClick=${exportMatrixCsv}>ייצוא לדף אחד (CSV)</button>
            </div>
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>שחקן</th>
                    ${sortedSessions.map(s => html`<th key=${s.id}>${fmtDate(s.date)}</th>`)}
                  </tr>
                </thead>
                <tbody>
                  ${sortedPlayers.map(p => html`
                    <tr key=${p.id}>
                      <td class="td-bold">${p.name}</td>
                      ${sortedSessions.map(s => {
                        const rec = cellRecord(p.id, s.id)
                        return html`
                          <td key=${s.id}>
                            ${rec
                              ? html`<span class=${'badge ' + CELL_CLASS[rec.status]} title=${rec.note || ''}>${CELL_LABEL[rec.status]}</span>`
                              : html`<span style=${{ color: 'var(--gray-300)' }}>—</span>`}
                          </td>
                        `
                      })}
                    </tr>
                  `)}
                </tbody>
              </table>
            </div>
          </div>
        `}
      </div>

      ${previewImg && html`<${ImagePreviewModal} src=${previewImg} onClose=${() => setPreviewImg(null)} />`}
    </div>
  `
}

// ── PIN Lock ───────────────────────────────────────────────────────
const PIN = '6040'

function PinScreen({ onUnlock }) {
  const [value, setValue]   = useState('')
  const [error, setError]   = useState(false)

  const handleChange = (e) => {
    const v = e.target.value.replace(/\D/g, '').slice(0, 4)
    setValue(v)
    setError(false)
    if (v.length === 4) {
      if (v === PIN) {
        sessionStorage.setItem('pin-ok', '1')
        onUnlock()
      } else {
        setError(true)
        setTimeout(() => { setValue(''); setError(false) }, 800)
      }
    }
  }

  return html`
    <div style=${{
      position: 'fixed', inset: 0, background: 'var(--black)',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      justifyContent: 'center', gap: 36, direction: 'rtl',
      padding: '0 24px',
    }}>
      <div style=${{ textAlign: 'center' }}>
        <div style=${{ fontSize: 28, fontWeight: 800, color: 'var(--white)', marginBottom: 10, letterSpacing: -0.5 }}>כפר יונה נוער</div>
        <div style=${{ fontSize: 15, color: 'rgba(255,255,255,0.4)' }}>הכנס קוד כניסה</div>
      </div>

      <div style=${{ display: 'flex', gap: 18, direction: 'ltr' }}>
        ${[0,1,2,3].map(i => html`
          <div key=${i} style=${{
            width: 18, height: 18, borderRadius: '50%',
            background: value.length > i
              ? (error ? '#f87171' : 'var(--white)')
              : 'rgba(255,255,255,0.2)',
            transition: 'background 0.15s',
          }} />
        `)}
      </div>

      <input
        type="password"
        inputMode="numeric"
        pattern="[0-9]*"
        maxLength="4"
        autoFocus
        value=${value}
        onInput=${handleChange}
        style=${{
          position: 'absolute', opacity: 0, width: 1, height: 1,
        }}
      />

      <div style=${{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 16, width: '100%', maxWidth: 280 }}>
        ${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k => html`
          <button
            key=${k}
            onClick=${() => {
              if (k === '⌫') {
                setValue(v => v.slice(0, -1))
                setError(false)
              } else if (k !== '' && value.length < 4) {
                const v = value + k
                setValue(v)
                setError(false)
                if (v.length === 4) {
                  if (v === PIN) { sessionStorage.setItem('pin-ok','1'); onUnlock() }
                  else { setError(true); setTimeout(() => { setValue(''); setError(false) }, 800) }
                }
              }
            }}
            style=${{
              height: 72, borderRadius: 18, border: 'none',
              background: k === '' ? 'transparent' : 'rgba(255,255,255,0.08)',
              color: 'var(--white)', fontSize: k === '⌫' ? 22 : 26,
              fontWeight: 500, cursor: k === '' ? 'default' : 'pointer',
              fontFamily: 'var(--font)', transition: 'background 0.12s',
              WebkitTapHighlightColor: 'transparent',
            }}
          >${k}</button>
        `)}
      </div>

      ${error && html`<div style=${{ fontSize: 14, color: '#f87171' }}>קוד שגוי, נסה שוב</div>`}
    </div>
  `
}

// ── App ────────────────────────────────────────────────────────────
function App() {
  const [unlocked, setUnlocked] = useState(() => sessionStorage.getItem('pin-ok') === '1')
  if (!unlocked) return html`<${PinScreen} onUnlock=${() => setUnlocked(true)} />`

  const [activeTab, setActiveTab] = useState('dashboard')
  const [selectedSessionId, setSelectedSessionId] = useState(null)
  const [data, setData] = useState(DEFAULT_DATA)
  const [loading, setLoading] = useState(true)

  const reload = async () => {
    const [pl, se, at] = await Promise.all([
      sb.from('players').select('*').order('name', { ascending: true }),
      sb.from('sessions').select('*').order('date', { ascending: false }),
      sb.from('attendance').select('*'),
    ])
    setData({ players: pl.data || [], sessions: se.data || [], attendance: at.data || [] })
    setLoading(false)
  }

  useEffect(() => { reload() }, [])

  const changeTab = (tab) => {
    if (tab !== 'sessions') setSelectedSessionId(null)
    setActiveTab(tab)
  }

  const openSession = (id) => {
    setSelectedSessionId(id)
    setActiveTab('sessions')
  }

  if (loading) return html`<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:var(--font);font-size:16px;color:#71717a">טוען...</div>`

  return html`
    <div class="app-layout">
      <${Sidebar} activeTab=${activeTab} setActiveTab=${changeTab} />
      <main class="main-content">
        ${activeTab === 'dashboard' && html`
          <${Dashboard}
            players=${data.players}
            sessions=${data.sessions}
            attendance=${data.attendance}
            onOpenSession=${openSession}
            setActiveTab=${changeTab}
          />`}
        ${activeTab === 'players' && html`
          <${Players} players=${data.players} attendance=${data.attendance} onReload=${reload} />`}
        ${activeTab === 'sessions' && html`
          <${Sessions}
            sessions=${data.sessions}
            players=${data.players}
            attendance=${data.attendance}
            selectedId=${selectedSessionId}
            onSelect=${setSelectedSessionId}
            onReload=${reload}
          />`}
        ${activeTab === 'report' && html`
          <${Report} players=${data.players} sessions=${data.sessions} attendance=${data.attendance} />`}
      </main>
    </div>
  `
}

render(html`<${App} />`, document.getElementById('root'))
</script>
</body>
</html>
